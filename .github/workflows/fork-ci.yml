# Fork CI for shuv1337/executor. The upstream v2 export ships without .github/,
# so nothing gated this fork. Kept in its own file so upstream syncs never touch it.
name: fork-ci

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # format, lint (deny warnings), typecheck and the repo's structural checks
      - run: bun run check
      # Self-contained e2e suites (no cloud, browser or Docker). ci-selection and
      # export-public are left out: they assume upstream's main-branch CI layout.
      - name: tests
        run: |
          set -euo pipefail
          for suite in pglite typecheck-runner prepare-cache emulator-failures dashboard-file-names release-archives; do
            echo "::group::e2e:$suite"
            bun run "e2e:$suite"
            echo "::endgroup::"
          done

  # Self-host scenarios for scoped-connection widening, OAuth registration, app
  # User-Agent, and load-failure containment, plus local MCP search. Motel's collector build requires
  # Bun 1.4.4, so this job does not share check's 1.3.11 pin. No extra secrets:
  # the runner mints its own API key. CI disables the e2e prepare cache.
  security-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - run: bun run e2e:prepare
      - name: Security scenarios
        run: |
          bun run e2e:self-host -- --test-name 'application_type|fetch without a User-Agent names Executor|cannot create an all-apps connection|cannot widen a connection or mint|fails to load fails only its own reads'
      # Run the large cold catalog alone, not beside the functional scenarios' servers.
      - name: Cold MCP discovery
        run: bun run e2e:self-host --test-name 'Cold MCP discovery serves 8549'
      - name: MCP search scenarios
        run: |
          bun run e2e:local --test-name 'MCP search resolves namespace-relative dotted paths|A broad MCP tool search returns concise pages'
